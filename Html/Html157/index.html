<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Költség</title>

    <style>
        table {
            border-collapse: collapse;
            margin: 20px auto;
            text-align: center;
        }

        th, td {
            border: 1px solid black;
            padding: 6px;
        }
    </style>
</head>
<body>
    <h1>Költség</h1>

    <table>
        <tr>
            <th>Feldolgozás</th>
            <th colspan="2">Költség</th>
        </tr>
        <tr>
            <td>Szállítás</td>
            <td>500 Ft</td>
            <td rowspan="3">Összesen: 3000 Ft</td>
        </tr>
        <tr>
            <td>Raktározás</td>
            <td>2000 FT</td>
        </tr>
        <tr>
            <td>Üzemeltetés</td>
            <td>500 FT</td>
        </tr>
    </table>
    
</body>
</html>
