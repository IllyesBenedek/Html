<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Felszerelés</title>

    <style>
        table {
            border-collapse: collapse;
            margin: 20px auto;
            text-align: center;
        }

        th, td {
            border: 1px solid black;
            padding: 6px;
        }
    </style>
</head>
<body>

    <caption>Felszerelés</caption>

    <table>
        <tr>
            <th>Felszerelés</th>
            <th>Állapot</th>
            <th>Ár</th>
            <th>Összesen</th>
        </tr>
        <tr>
            <td>Fényképezőgép</td>
            <td>Újszerű</td>
            <td>10000 Ft</td>
            <td rowspan="5">110000 Ft</td>
        </tr>
        <tr>
            <td>Telefontöltő</td>
            <td>Használható</td>
            <td>20000 Ft</td>
        </tr>
        <tr>
            <td>Tv távirányító</td>
            <td>Rossz állapotban</td>
            <td>30000 Ft</td>
        </tr>
        <tr>
            <td>Laptop</td>
            <td>Új</td>
            <td>50000 Ft</td>
        </tr>
    </table>
    
</body>
</html>
