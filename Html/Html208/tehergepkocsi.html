    <h1>Tehergépkocsi</h1>

    <p>
        1771-ben Nicolas-Joseph Cugnot épetett egy járművet,
        ágyuk vontatására. Ezt számítjuk az első <a href="https://hu.wikipedia.org/wiki/Tehergepkocsi">tehergépjárműnek</a>.
        Cugnot járművét nem használták tovább az első próbaútjánál,
        mivel kidöntött vele egy falat. A problémát az orrnehéz
        jármű irányíthatatlansága okozta.
    </p>
