<!DOCTYPE html>
<html lang="hu">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Könyvek</title>

    <style>
        table {
            border-collapse: collapse;
            margin: 20px auto;
            text-align: center;
        }

        th,
        td {
            border: 1px solid black;
            padding: 7px;
        }
    </style>
</head>

<body>


    <table>
        <caption>Könyvek</caption>
        <tr>
            <th>Könyv</th>
            <th colspan="2">Szerző</th>
        </tr>
        <tr>
            <td rowspan="2">Könyv A</td>
            <td>Fikció</td>
            <td>Szerző A</td>
        </tr>
        <tr>
            <td>Nefikció</td>
            <td>Szerző B</td>
        </tr>
        <tr>
            <td>Könyv B</td>
            <td>Fikció</td>
            <td>Szerző C</td>
        </tr>
        <tr>
            <td>Könyv C</td>
            <td>Nefikció</td>
            <td>Szerző D</td>
        </tr>
    </table>

</body>

</html>
