<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Termékek</title>

    <style>
        table {
            border-collapse: collapse;
            margin: 20px auto;
            text-align: center;
        }

        th, td {
            border: 1px solid black;
            padding: 6px;
            
        }
    </style>
</head>
<body>
    <h1>Termékek</h1>

    <table>
        <tr>
            <th rowspan="2">Termék</th>
            <th colspan="3">Részletek</th>
        </tr>
        <tr>
            <th>Ár</th>
            <th>Mennyiség</th>
            <th>Szállítási idő</th>
        </tr>
        <tr>
            <td>Termék A</td>
            <td>1000 Ft</td>
            <td>50</td>
            <td>3 nap</td>
        </tr>
        <tr>
            <td>Termék B</td>
            <td>1500 Ft</td>
            <td>30</td>
            <td>1 hét</td>
        </tr>
        <tr>
            <td>Termék C</td>
            <td>2000 Ft</td>
            <td>20</td>
            <td>2 nap</td>
        </tr>
    </table>
    
</body>
</html>
